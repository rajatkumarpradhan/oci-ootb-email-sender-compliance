[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-email-sender-compliance"
version = "0.1.0"
description = "OCI Email Delivery sender template plus an offline deliverability compliance checker"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-email-sender-compliance = "oci_ootb_email_sender_compliance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
